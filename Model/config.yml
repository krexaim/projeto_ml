# =============================================================================
# config.yml — Configuração da ETAPA DE MODELAGEM (/Model)
# Projeto: Home Credit Default Risk (LABDATA / FIA)
#
# A estrutura de entrega (slide 10 do brief) exige um arquivo de configuração
# em /Model além do de /DataPipeline. Este aqui cuida do domínio de MODELO e
# AVALIAÇÃO. As poucas chaves compartilhadas com o pipeline de dados (caminho da
# ABT e variável alvo) são repetidas aqui para que train.py/evaluation rodem de
# forma independente.
#
# REGRA DO PROJETO: nada de hardcoding. Caminhos relativos à raiz, via pathlib.
# =============================================================================

project:
  target: TARGET            # variável alvo (compartilhada com o pipeline de dados)
  random_state: 42

# --- Entrada (onde está a ABT) ----------------------------------------------
data:
  data_dir: Dados

# --- Saída (modelo treinado + gráficos) -------------------------------------
paths:
  model_dir: Model/artifacts
  abt_dir: Dados/abt

# --- Arquivos da ABT --------------------------------------------------------
abt_files:
  train: abt_train.parquet
  val: val_data.parquet
  test: test_data.parquet

# --- Modelagem (abt -> modelo) ----------------------------------------------
models:

  XGBOOST:
    enabled: true
    class: XGBClassifier
    params:
      n_estimators: 1000
      learning_rate: 0.05
      max_depth: 5
      scale_pos_weight: auto   # calculado em runtime a partir de y_train (ver train.py)
      early_stopping_rounds: 50
      
  RANDOM_FOREST:
    enabled: true
    class: RandomForestClassifier
    params:
      class_weight: balanced
      n_estimators: 200
      n_jobs: -1
  
  LOGISTIC_REGRESSION:
    enabled: true
    class: LogisticRegression
    use_scaler: true
    params:
      class_weight: balanced
      max_iter: 1000

threshold: 0.25          # corte de probabilidade p/ classe positiva
  
feature_engineering:
    renda_por_familia: true            # AMT_INCOME_TOTAL / (CNT_FAM_MEMBERS + 1)

# --- Avaliação (métrica oficial: ROC AUC) -----------------------------------
evaluation:
  primary_metric: roc_auc
  min_recall_target: 0.70              # piso de recall usado no threshold (train.py)
  report_metrics:                      
    - roc_auc
    - precision
    - recall
    - f1
    - ks
    - confusion_matrix
    - pr_curve
